name: Выпуск готовой версии

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить версию тега
        run: node -e "const v=require('./package.json').version;if(process.env.GITHUB_REF_NAME!=='v'+v)throw new Error('Tag and package version differ')"

      - name: Восстановить закрытый ключ CRX
        env:
          NMO_CRX_PRIVATE_KEY_BASE64: ${{ secrets.NMO_CRX_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$NMO_CRX_PRIVATE_KEY_BASE64"
          mkdir -p "$HOME/.codex/nmo-helper-signing"
          printf '%s' "$NMO_CRX_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.codex/nmo-helper-signing/nmo-helper.pem"
          chmod 600 "$HOME/.codex/nmo-helper-signing/nmo-helper.pem"

      - name: Запустить тесты
        run: npm test -- --reporter=dot

      - name: Собрать релиз
        run: npm run package:github

      - name: Проверить архивы и контрольные суммы
        run: npm run validate:release

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" releases/* --verify-tag --generate-notes --title "NMO Helper ${GITHUB_REF_NAME#v}"
